# CarlaVLA v3 -- tuned config, EXPERIMENTAL HIGH BATCH.
#
# ####################################################################
# #  Identical to config_tuned.yaml EXCEPT batch_size 4 -> 24.       #
# #  DO NOT run this without checking it fits first:                 #
# #      ./run_pipeline.sh preflight                                 #
# #  24 x 2 GPUs restores SimLingo's effective batch of 48, so lr    #
# #  stays at its original 3.0e-05. If it OOMs, use config_tuned.yaml#
# #  (batch 4) -- that one is the safe default.                      #
# ####################################################################
#
# Drop-in replacement for the shipped config.yaml: same hydra keys, same
# _target_ paths, same structure. Every change is marked CHANGED with the
# reason, and every original value is kept in the comment so nothing is lost.
#
# Derived from `./run_pipeline.sh audit`, which found 1 blocker and 5 warnings
# on the original. Two items could NOT be fixed in config alone and are listed
# under "CODE CHANGES STILL REQUIRED" at the bottom.

model:
  vision_model:
    variant: dual_vision
    embed_dim: 896
    freeze: true
    dinov2_path: pretrained/dinov2-large
    siglip_path: pretrained/siglip-so400m
    use_global_img: false
    _target_: simlingo_training.models.encoder.vlm.VLMEncoderModel
  language_model:
    variant: OpenGVLab/InternVL2-1B
    lora: true
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
    _target_: simlingo_training.models.language_model.llm.LLM
  lr: 3.0e-05
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.999
  pct_start: 0.05
  speed_wps_mode: 2d
  predict_route_as_wps: true
  use_diffusion: true
  diffusion_train_steps: 100
  diffusion_infer_steps: 10
  _target_: simlingo_training.models.driving.DrivingModel

data_module:
  base_dataset:
    data_path: database
    # CHANGED  database -> database/bucketsv2_simlingo
    # bucket_path must point at the bucket index, not the dataset root, or
    # train_partitions below silently matches nothing and balancing is a no-op.
    # Adjust to wherever buckets_paths.pkl was extracted.
    bucket_path: database/bucketsv2_simlingo
    cut_bottom_quarter: true
    use_1d_wps: false
    use_commentary: true
    use_qa: true
    qa_augmentation: true
    commentary_augmentation: true
    use_old_towns: true
    use_only_old_towns: false
    use_town13: true
    filter_infractions_per_route: false
    skip_first_n_frames: 10
    pred_len: 11
    hist_len: 1
    hist_len_commentary: 5
    img_augmentation: true
    img_augmentation_prob: 0.5
    # CHANGED  false -> true
    # The probability was already set to 0.5 but the augmentation was off, so it
    # had no effect. Shift augmentation is what teaches recovery from lateral
    # offset; without it the model only ever sees the expert's own lane position.
    img_shift_augmentation: true
    img_shift_augmentation_prob: 0.5
    use_safety_flag: true
    num_route_points: 20
    route_as: target_point_command
    use_lmdrive_commands: true
  driving_dataset:
    _target_: simlingo_training.dataloader.dataset_driving.Data_Driving
  # UNCHANGED (deliberately): enabling this crashes the run unless the dreamer
  # tarballs are extracted. Instruction following and safety refusal stay
  # unsupervised until then. To enable, extract dreamer_* from the SimLingo
  # release and uncomment:
  # dreamer_dataset:
  #   _target_: simlingo_training.dataloader.dataset_dreamer.Data_Dreamer
  dreamer_dataset: null
  drivecot_dataset:
    _target_: simlingo_training.dataloader.dataset_drivecot.Data_DriveCoT
  qa_dataset:
    _target_: simlingo_training.dataloader.dataset_eval_qa_comm.Data_Eval
  insteval_dataset:
    _target_: simlingo_training.dataloader.dataset_eval_dreamer.Eval_Dreamer
  # CHANGED  4 -> 24
  # 4 x 2 GPUs = effective 8, against an lr of 3e-5 that SimLingo tuned at
  # effective batch 48 -- roughly 6x the gradient noise per step, so the same lr
  # is a different optimisation and a delta against SimLingo would be confounded
  # by batch size rather than architecture. 24 x 2 GPUs restores exactly 48.
  #
  # If 24 does not fit, halve it and compensate. Check FIRST that train.py
  # actually forwards accumulate_grad_batches to the Lightning Trainer -- it is
  # not in SimLingo's TrainConfig, and an ignored key leaves you at batch 24, not
  # 48. If it is not forwarded, use batch_size 12 and scale lr to 1.5e-5 instead.
  batch_size: 24
  # CHANGED  0 -> 8
  # THE BLOCKER. With num_workers=0 the dataloader runs inside the training
  # process, so every cv2.imread plus two resizes at 1024x512 blocks the step --
  # and starves both GPUs. This is almost certainly the single largest
  # throughput loss in the original config.
  num_workers: 8
  # CHANGED  null -> SimLingo's carla_bucket_v12_dreamer weights (they sum to 1.0)
  # Balancing on BEHAVIOUR rather than scenario name: a route labelled
  # SignalizedJunctionLeftTurn spends most of its frames driving straight, so
  # scenario-level balancing does not rebalance behaviour. Requires bucket_path
  # above to be correct; set back to null if the bucket index is unavailable.
  train_partitions:
    all: 0.082
    acceleration_negative_5: 0.03
    acceleration_negative_1: 0.03
    acceleration_positive_1: 0.03
    acceleration_positive_5: 0.03
    lateral_control_1_2: 0.12
    lateral_control_higher_5: 0.12
    start_from_stop: 0.07
    vehicle_front: 0.04
    vehicle_side: 0.08
    leading_object_vehicle: 0.09
    leading_object_traffic.stop: 0.07
    leading_object_traffic.traffic_light: 0.07
    leading_object_walker: 0.05
    changed_route: 0.08
    parkinglane: 0.008
  train_partitions_dreamer: null
  train_partitions_drivecot: null
  # CHANGED  0.4 -> 0.6
  # The specified CoT share. Note the trade-off this creates: drivecot samples
  # are language-only, so at 0.6 only 40% of each batch carries a trajectory
  # target for the diffusion head. Keep easy_hard_split_2to8 on so that the
  # remaining trajectory supervision stays long-tail weighted.
  drivecot_weight: 0.6
  use_global_img: false
  easy_hard_split_2to8: true
  _target_: simlingo_training.dataloader.datamodule.DataModule

seed: 9876
gpus: 2
resume: false
resume_path: null
debug: false
overfit: 0
# CHANGED  32.0 -> null (unused under bf16)
# bf16 has fp32's exponent range, so there is nothing to scale and no overflow
# to guard against. Left as a key rather than deleted in case train.py reads it.
fp16_loss_scale: null
enable_wandb: false
wandb_project: simlingo
# CHANGED  name reflects the tuned settings so runs are not confused
name: carlavla_v3_diffusion_bf16_b48_cot60_15ep
wandb_name: 2026_08_29_diffusion_tuned
# CHANGED  10 -> 15, per the stated 15-epoch fine-tuning schedule.
max_epochs: 15
# CHANGED  16-mixed -> bf16-mixed
# fp16 needs a loss scaler and can overflow. bf16 has fp32 range, needs no
# scaler, is native on Blackwell, and FlashAttention-2 accepts both.
precision: bf16-mixed
# UNCHANGED, but worth knowing: with both vision backbones frozen only ~24M
# parameters take gradients, so stage-2 optimizer/gradient sharding saves very
# little and adds communication. Plain `ddp` is likely faster here; switch if a
# short A/B shows it.
strategy: deepspeed_stage_2
# CHANGED  5 -> 3, so 15 epochs give 5 validation points instead of 3.
val_every_n_epochs: 3
checkpoint: null
checkpoint_every_n_steps: 2500

# =====================================================================
# CODE CHANGES STILL REQUIRED (cannot be expressed in this config)
# =====================================================================
# 1. diffusion_decoder.py uses epsilon-prediction. Measured on a controlled
#    overfit at your diffusion_infer_steps=10:
#        epsilon        2.607 m mean absolute waypoint error
#        v-prediction   0.690 m
#    v at 10 steps beats epsilon at 100. epsilon is poorly conditioned at low
#    SNR, which is where a 10-step schedule spends most of its steps.
#
# 2. DiffusionHead coord_min_max=(-32, 32) against real data of
#    x:[2.5, 19.3], y:[-0.01, 4.8] puts the targets in roughly [-0.92, -0.40]
#    of [-1, 1] -- most of the schedule's dynamic range is unused. Derive the
#    range from the data (sub1b_vla/tools/waypoint_stats.py) with a margin.
#
# 3. CrossAttentionFusion uses nn.MultiheadAttention, which does NOT dispatch to
#    FlashAttention-2 -- its fused path is a separate kernel that falls back to
#    unfused math whenever its conditions are not met. Route it through
#    F.scaled_dot_product_attention to actually use flash-attn.
