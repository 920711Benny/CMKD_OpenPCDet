# Extended CPU config -- a run sized to actually learn something, not just to
# exercise code paths.
#
# The decisive change is `freeze: false`. In the real recipe the vision
# backbones are frozen because DINOv2 and SigLIP arrive carrying pretrained
# features. On this box the hub is unreachable, so they fall back to RANDOMLY
# INITIALISED stubs -- and freezing random weights means 5.24M of the model's
# 7.1M parameters contribute nothing while 0.5M trainable parameters try to
# extract driving semantics from random projections. No amount of extra training
# fixes that; it is a capacity ceiling, not a convergence problem.
#
# So for the offline stub path the vision encoders are TRAINED. This is not what
# the real recipe does and results here are still not driving results -- but it
# removes the artificial ceiling, which is what makes a longer run worth its time.
#
# Capacity is also raised across the board relative to tiny_cpu.
# sampling, losses) without GPU or downloaded weights. NOT a research config --
# backbones fall back to random StubViT/StubCausalLM, so metrics are meaningless.
experiment: cpu_extended
seed: 0
param_limit: 1000000000

model:
  language_model: __stub__
  use_language_tower_only: true
  spatial_model: __stub_spatial__
  semantic_model: __stub_semantic__
  freeze: false          # stubs are random: freezing them learns nothing
  allow_stub: true
  embed_dim: 256
  spatial_dim: 128
  num_semantic_tokens: 16
  image_size: 128
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.0
  pred_len: 11
  waypoint_dt: 0.2
  # Waypoint normalisation (metres): (wp - offset) / scale maps into [-1, 1].
  # Recompute for your dataset with tools.waypoint_stats -- a scale that does not
  # cover the data gets silently clipped by the sampler.
  waypoint_offset: [16.5, 0.0]
  waypoint_scale: [18.5, 12.0]
  clip_denoised: 1.0
  # 'v' (Salimans & Ho) is well conditioned across the whole schedule;
  # 'epsilon' degrades noticeably at the 10-step inference budget.
  prediction_type: v
  diffusion_train_steps: 100
  diffusion_infer_steps: 10
  diffusion_dim: 128
  diffusion_depth: 3
  diffusion_heads: 4

loss: {lm: 1.0, diffusion: 1.0, consistency: 0.2, intent_ce: 0.5, align_warmup_steps: 500}
consistency: {}

data:
  root: ./data
  train_partitions: {driving: 0.25, drivecot: 0.60, dreamer: 0.15}
  drivecot_weight: 0.4
  generate_cot: true
  qa_probability: 0.35
  use_safety_flag: true
  easy_hard_split_2to8: true
  scenario_bucketing: true
  img_augmentation: true
  cut_bottom_quarter: true
  route_as: target_point_command
  max_text_len: 48
  carla_surrogate: true
  surrogate_size: 49152

train:
  precision: fp32
  strategy: auto
  devices: 1
  batch_size: 16
  accumulate_grad_batches: 1
  num_workers: 2
  max_epochs: 15
  max_steps: 0
  lr: 6.0e-4
  min_lr: 1.0e-5
  weight_decay: 0.0
  warmup_steps: 0
  grad_clip: 1.0
  log_every: 500
  ckpt_every: 1000
  out_dir: ./runs

sensors:
  rgb_front: {x: 1.3, y: 0.0, z: 2.3, pitch: -5.0, roll: 0.0, yaw: 0.0, fov: 100, width: 1024, height: 512}

inference: {control_hz: 10, latency_budget_ms: 80, cot_hz: 1, controller: pure_pursuit_pid}
